<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lógica e Sustentabilidade - ONLINE</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;text-align:center;background:#e8f5e9;padding:15px;margin:0}
  h1{font-size:28px;margin-bottom:5px}
  .card{background:white;padding:22px;border-radius:18px;max-width:640px;margin:15px auto;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .badge{display:inline-block;background:#2e7d32;color:white;padding:5px 12px;border-radius:20px;font-size:13px;margin-bottom:10px}
  .pergunta{font-size:19px;line-height:1.5;min-height:70px;text-align:left}
  .explica{background:#fff3cd;padding:12px;border-radius:10px;text-align:left;font-size:15px;margin-top:10px}
  .conceito{background:#e8f5e9;padding:14px;border-radius:12px;text-align:left;font-size:15px;line-height:1.5;margin:10px 0}
  button{font-size:17px;padding:12px 18px;margin:6px;border:none;border-radius:12px;cursor:pointer}
  .v{background:#4caf50;color:white}
  .f{background:#f44336;color:white}
  .opt{background:#e3f2fd;width:100%}
  .opt:hover{background:#bbdefb}
  .next{background:#2196f3;color:white}
  .menu{background:#2e7d32;color:white;width:100%;padding:15px;font-size:18px}
  .gold{background:#ffb300}
  .online{background:#6a1b9a;color:white;width:100%;padding:15px;font-size:18px}
  #feedback{font-weight:bold;margin-top:12px;font-size:17px}
  .barra{height:10px;background:#ddd;border-radius:10px;overflow:hidden;margin:10px 0}
  .progresso{height:100%;background:#4caf50;width:0%;transition:.3s}
  table{margin:10px auto;border-collapse:collapse;width:100%}
  td,th{border:1px solid #ccc;padding:8px 10px}
  .certo{color:#2e7d32}.errado{color:#c62828}
  input[type=text]{font-size:18px;padding:12px;width:100%;text-align:center;border-radius:10px;border:2px solid #2e7d32;margin:10px 0}
  input[type=number]{font-size:18px;padding:8px;width:110px;text-align:center;border-radius:8px;border:2px solid #ccc}
  .ranking{text-align:left}
  .topo{display:flex;justify-content:space-between;align-items:center;background:#2e7d32;color:white;padding:10px 15px;border-radius:12px;margin-bottom:10px}
  .small{font-size:13px;color:#666}
  .perdeu{color:#c62828;font-size:13px}
  select{font-size:17px;padding:8px 10px;border-radius:8px;border:2px solid #2e7d32;margin:2px;cursor:pointer}
  .tabela5 td{font-size:16px}
  .tabela5 select{width:70px}
  .codigo-sala{font-size:32px;letter-spacing:8px;background:#f3e5f5;padding:12px;border-radius:12px;border:2px dashed #6a1b9a;font-weight:bold}
  .vivo{color:#2e7d32;font-weight:bold}
</style>
</head>
<body>
<h1>🌳 Lógica e Sustentabilidade</h1>
<div class="card" id="tela"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 👇👇👇 COLA AQUI O SEU firebaseConfig QUE O FIREBASE TE DEU 👇👇👇
const firebaseConfig = {
  apiKey: "COLOQUE_AQUI_SUA_APIKEY",
  authDomain: "COLOQUE_AQUI_SEU_PROJETO.firebaseapp.com",
  databaseURL: "https://COLOQUE_AQUI_SEU_PROJETO-default-rtdb.firebaseio.com",
  projectId: "COLOQUE_AQUI_SEU_PROJETO",
  storageBucket: "COLOQUE_AQUI_SEU_PROJETO.appspot.com",
  messagingSenderId: "COLOQUE_AQUI",
  appId: "COLOQUE_AQUI"
};
// 👆👆👆 ATÉ AQUI 👆👆👆

let db = null;
try{ const app = initializeApp(firebaseConfig); db = getDatabase(app); }catch(e){ console.log("Firebase não configurado ainda", e); }
window._db = db; window._ref = ref; window._set = set; window._update = update; window._onValue = onValue; window._get = get;
window._firebasePronto = !!db && !firebaseConfig.apiKey.includes("COLOQUE");
</script>

<script>
let jogador = localStorage.getItem('gv_nome') || "";
let pontos = 0;
let ranking = JSON.parse(localStorage.getItem('gv_ranking') || "[]");
const tela = document.getElementById('tela');

// ===== ONLINE =====
let modoOnline = false;
let codigoSala = "";
let meuId = localStorage.getItem('gv_id') || ("p"+Math.random().toString(36).slice(2,8));
localStorage.setItem('gv_id', meuId);
let rankingOnline = [];

function gerarCodigo(){ return Math.random().toString(36).slice(2,6).toUpperCase(); }

function syncOnline(){
  if(!modoOnline || !window._firebasePronto) return;
  window._update(window._ref(window._db, 'salas/'+codigoSala+'/jogadores/'+meuId), {nome:jogador, pontos:pontos, atualizado: Date.now()});
}
function escutarSala(){
  if(!window._firebasePronto) return;
  window._onValue(window._ref(window._db, 'salas/'+codigoSala+'/jogadores'), (snap)=>{
    const dados = snap.val() || {};
    rankingOnline = Object.values(dados).sort((a,b)=>b.pontos-a.pontos);
    const el = document.getElementById('rankingOnlineAoVivo');
    if(el){
      el.innerHTML = rankingOnline.length ? rankingOnline.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-radius:8px;${r.nome===jogador?'background:#e8f5e9;border:2px solid #2e7d32':''}"><span>${i+1}º <b>${r.nome}</b> ${r.nome===jogador?'(você)':''}</span><b>${r.pontos} pts</b></div>`).join('') : '<p>Ninguém na sala ainda...</p>';
    }
  });
}
function telaOnline(){
  tela.innerHTML=`
    <span class="badge" style="background:#6a1b9a">🌐 MODO ONLINE</span>
    <h2>Jogar com a turma</h2>
    <p>Todo mundo joga ao mesmo tempo no seu celular e o ranking atualiza ao vivo!</p>
    <input type="text" id="nomeOnline" placeholder="Seu nome..." value="${jogador}" maxlength="20">
    <button class="online" onclick="criarSala()">➕ Criar nova sala</button>
    <p>ou</p>
    <input type="text" id="codigoEntrar" placeholder="Código da sala, ex: AB12" style="text-transform:uppercase">
    <button class="next" style="width:100%" onclick="entrarSala()">Entrar na sala ▶️</button>
    <br><br><button onclick="menu()">⬅ Voltar para modo sozinho</button>
    ${!window._firebasePronto?`<div class="explica">⚠️ <b>Firebase ainda não configurado!</b><br>Você colou o firebaseConfig no código? Sem isso o modo online não conecta. O modo sozinho continua funcionando normal.</div>`:''}
  `;
}
function criarSala(){
  const v=document.getElementById('nomeOnline').value.trim();
  if(!v){ alert("Digite seu nome!"); return; }
  jogador=v; localStorage.setItem('gv_nome', jogador); pontos=0;
  codigoSala=gerarCodigo(); modoOnline=true;
  syncOnline(); escutarSala(); telaSala();
}
function entrarSala(){
  const v=document.getElementById('nomeOnline').value.trim();
  const cod=document.getElementById('codigoEntrar').value.trim().toUpperCase();
  if(!v || !cod){ alert("Digite seu nome e o código da sala!"); return; }
  jogador=v; localStorage.setItem('gv_nome', jogador); pontos=0;
  codigoSala=cod; modoOnline=true;
  syncOnline(); escutarSala(); telaSala();
}
function telaSala(){
  tela.innerHTML=`
    <span class="badge" style="background:#6a1b9a">🌐 ONLINE • SALA ${codigoSala}</span>
    <h2>Você está na sala!</h2>
    <p>Passa esse código para seus amigos:</p>
    <div class="codigo-sala">${codigoSala}</div>
    <p class="small">Eles entram em: Modo Online > Entrar na sala > digitam esse código</p>
    <h3>🏆 Ranking ao vivo <span class="vivo">● AO VIVO</span></h3>
    <div id="rankingOnlineAoVivo" class="ranking"><p>Carregando...</p></div>
    <br><button class="next" onclick="menu()">Começar a jogar! ▶️</button>
    <br><button style="background:#f44336;color:white" onclick="modoOnline=false;codigoSala='';menu()">Sair da sala</button>
  `;
  // força atualizar a lista agora
  setTimeout(()=>{ syncOnline(); }, 500);
}
function salvarRanking(){
  if(!jogador) return;
  // sempre salva local
  ranking.push({nome:jogador, pontos:pontos, data:new Date().toLocaleDateString('pt-BR')});
  ranking.sort((a,b)=>b.pontos-a.pontos);
  ranking = ranking.slice(0,10);
  localStorage.setItem('gv_ranking', JSON.stringify(ranking));
  // se online, manda pro Firebase também
  syncOnline();
}
// toda vez que ganha/perde ponto, sincroniza
const _perderOriginal = null;
function mostrarRankingHTML(){
  const medals=["🥇","🥈","🥉"];
  return ranking.map((r,i)=>`
    <div style="display:flex;justify-content:space-between;padding:8px;border-radius:8px;${i<3?'background:#fff8e1':''}">
      <span><span>${medals[i]||(i+1)+'º'}</span> <b>${r.nome}</b> <span class="small">${r.data}</span></span>
      <b>${r.pontos} pts</b>
    </div>`).join('');
}
function telaNome(){
  tela.innerHTML=`
    <h2>👋 Olá, Guardião!</h2>
    <p>Qual é o seu nome?</p>
    <input type="text" id="nomeInput" placeholder="Ex: Maria, João, Ana..." value="${jogador}" maxlength="20">
    <br><button class="next" onclick="comecar()">Começar a jogar ▶️</button>
    <p class="small">Seu nome fica salvo para o ranking. Errou? Perde 5 pontos. Acertou? Ganha pontos!</p>
    ${ranking.length?`<h3>🏆 Ranking</h3><div class="ranking">${mostrarRankingHTML()}</div>`:''}
  `;
}
function comecar(){
  const v=document.getElementById('nomeInput').value.trim();
  if(!v){ alert("Digite seu nome primeiro!"); return; }
  jogador=v; localStorage.setItem('gv_nome', jogador);
  pontos=0; menu();
}
function menu(){
  tela.innerHTML=`
    <div class="topo"><span>👤 <b>${jogador}</b></span><span>⭐ ${pontos} pts</span></div>
    ${modoOnline?`<div style="background:#f3e5f5;padding:10px;border-radius:10px;margin-bottom:10px"><b>🌐 ONLINE • Sala: ${codigoSala}</b> <span class="vivo">● AO VIVO</span><br><button class="next" style="padding:8px 12px;font-size:14px" onclick="telaSala()">Ver ranking ao vivo</button></div>`:''}
    <h2>Escolha seu nível 🗺️</h2>
    <button class="menu" onclick="intro1()">🌱 Nível 1 - Verdadeiro ou Falso</button>
    <button class="menu" onclick="intro2()">🧠 Nível 2 - Válido ou Inválido?</button>
    <button class="menu" onclick="intro3()">📊 Nível 3 - Tabela-Verdade na Floresta</button>
    <button class="menu" onclick="intro4()">🌲 Nível 4 - Fragmentação e Efeito de Borda</button>
    <button class="menu" onclick="intro5()" style="background:#6a1b9a">✏️ Nível 5 - Monte a Tabela-Verdade</button>
    <button class="online" onclick="telaOnline()">🌐 Modo Online - Jogar com a turma</button>
    <button class="menu gold" style="color:#333" onclick="verRanking()">🏆 Ver Ranking Completo</button>
    <button class="menu" style="background:#666" onclick="trocarJogador()">🔄 Trocar Jogador</button>
  `;
}
function trocarJogador(){ jogador=""; localStorage.removeItem('gv_nome'); pontos=0; modoOnline=false; telaNome(); }
function verRanking(){
  tela.innerHTML=`
    <h2>🏆 Ranking - Top 10</h2>
    ${modoOnline?`<p><b>🌐 Sala ${codigoSala} - AO VIVO</b></p><div class="ranking" id="rankingOnlineAoVivo">${rankingOnline.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:8px"><span>${i+1}º <b>${r.nome}</b></span><b>${r.pontos} pts</b></div>`).join('')||'Ninguém ainda'}</div><br><button class="next" onclick="menu()">Voltar</button>`:`${ranking.length?`<div class="ranking">${mostrarRankingHTML()}</div>`:`<p>Ninguém jogou ainda. Seja o primeiro!</p>`}<br><button class="next" onclick="menu()">Voltar</button><button style="background:#f44336;color:white" onclick="if(confirm('Apagar todo o ranking?')){ranking=[];localStorage.removeItem('gv_ranking');verRanking()}">Apagar Ranking</button>`}
  `;
}
function perderPontos(){
  pontos = Math.max(0, pontos - 5);
  syncOnline();
}
function ganharPontos(v){ pontos+=v; syncOnline(); }

// ================= NÍVEL 1 =================
function intro1(){
  tela.innerHTML=`
    <span class="badge">NÍVEL 1</span>
    <h2>🌱 Antes de começar...</h2>
    <div class="conceito">
      <b>O que você vai fazer?</b> Ler uma afirmação sobre a floresta e dizer se ela é <b>Verdadeira (V)</b> ou <b>Falsa (F)</b>.<br><br>
      <b>Conceitos que vão aparecer:</b><br>
      - <b>Fotossíntese:</b> a árvore absorve gás carbônico e libera oxigênio.<br>
      - <b>Desmatamento:</b> cortar a floresta. Destrói o habitat e o nicho ecológico dos animais.<br>
      - <b>Reflorestamento:</b> plantar novas árvores onde a floresta foi destruída.<br>
      - <b>Fragmentação:</b> dividir a floresta em pedaços. Mesmo sem desmatar tudo, já prejudica, porque cria borda e isola as populações.<br>
      - <b>Queimada:</b> polui o ar, não limpa.
    </div>
    <p>✅ Acerto: <b>+10</b> &nbsp; | &nbsp; ❌ Erro: <b>-5</b></p>
    <button class="next" onclick="nivel1()">Entendi, começar! ▶️</button>
    <button onclick="menu()">Voltar</button>
  `;
}
let n1=0;
const perguntas1=[
  {t:"As árvores fazem fotossíntese e absorvem gás carbônico.", r:true, e:"Sim! E liberam oxigênio."},
  {t:"O desmatamento ajuda a preservar os animais.", r:false, e:"Não! Destrói o habitat e o nicho ecológico deles."},
  {t:"Reflorestar é plantar novas árvores onde a floresta foi destruída.", r:true, e:"Isso mesmo!"},
  {t:"Queimar a floresta limpa o ar.", r:false, e:"Pelo contrário, polui e aumenta o gás carbônico."},
  {t:"Fragmentar a floresta sem desmatar não prejudica ninguém.", r:false, e:"Prejudica sim! Cria borda, isola e muda luz, vento e umidade."},
];
function nivel1(){ n1=0; mostrar1(); }
function mostrar1(){
  if(n1>=perguntas1.length){ tela.innerHTML=`<h2>🎉 Nível 1 completo!</h2><p>${jogador}, você tem ${pontos} pontos.</p><button class="next" onclick="menu()">Menu</button>`; return; }
  const p=perguntas1[n1];
  tela.innerHTML=`<span class="badge">NÍVEL 1 • ${n1+1}/5 • ${jogador} • ${pontos} pts</span><div class="barra"><div class="progresso" style="width:${n1*20}%"></div></div><p class="pergunta">${p.t}</p><button class="v" onclick="resp1(true)">Verdadeiro</button><button class="f" onclick="resp1(false)">Falso</button><p id="feedback"></p><div id="btn"></div><p class="perdeu">Erro = -5 pontos</p>`;
}
function resp1(resp){
  const p=perguntas1[n1]; const ok=p.r===resp; if(ok) ganharPontos(10); else perderPontos();
  document.getElementById('feedback').innerHTML=ok?`<span class="certo">✅ Acertou! +10</span>`:`<span class="errado">❌ Errou! -5</span>`;
  document.getElementById('btn').innerHTML=`<div class="explica">${p.e}</div><button class="next" onclick="n1++;mostrar1()">Próxima →</button>`;
}

// ================= NÍVEL 2 =================
function intro2(){
  tela.innerHTML=`
    <span class="badge">NÍVEL 2</span>
    <h2>🧠 Antes de começar...</h2>
    <div class="conceito">
      <b>O que é um argumento válido?</b><br>
      É quando <b>SE as premissas fossem verdadeiras, a conclusão TERIA que ser verdadeira</b>. Não importa se na vida real a premissa é verdadeira ou não, importa a FORMA.<br><br>
      <b>Exemplo válido:</b><br>
      Se chover, então o chão molha. Choveu. Logo, o chão molhou.<br><br>
      <b>Exemplo INVÁLIDO:</b><br>
      Se chover, então o chão molha. O chão molhou. Logo, choveu.<br>
      → Inválido! O chão pode ter molhado porque alguém jogou água com a mangueira.<br><br>
      <b>Outro inválido:</b><br>
      Se chover, então o chão molha. Não choveu. Logo, o chão não molhou.<br>
      → Inválido! Pode ter molhado por outro motivo.<br><br>
      <b>Você só vai classificar: VÁLIDO ou INVÁLIDO.</b> Sem nome de falácia!
    </div>
    <p>✅ Acerto: <b>+20</b> &nbsp; | &nbsp; ❌ Erro: <b>-5</b></p>
    <button class="next" onclick="nivel2()">Entendi, começar! ▶️</button>
    <button onclick="menu()">Voltar</button>
  `;
}
let n2=0;
const perguntas2=[
  {t:"<b>Premissa 1:</b> Se reflorestarmos, então a biodiversidade aumenta.<br><b>Premissa 2:</b> Reflorestamos.<br><b>Conclusão:</b> Logo, a biodiversidade aumenta.", r:"valido", e:"<b>VÁLIDO.</b> É o formato: Se p, então q. p. Logo, q."},
  {t:"<b>Premissa 1:</b> Se reflorestarmos, então as mudas crescem.<br><b>Premissa 2:</b> As mudas cresceram.<br><b>Conclusão:</b> Logo, reflorestamos.", r:"invalido", e:"<b>INVÁLIDO.</b> As mudas podem ter crescido sozinhas, porque choveu muito ou porque alguém regou."},
  {t:"<b>Premissa 1:</b> Se reflorestarmos, então as mudas crescem.<br><b>Premissa 2:</b> Não reflorestamos.<br><b>Conclusão:</b> Logo, as mudas não cresceram.", r:"invalido", e:"<b>INVÁLIDO.</b> Mesmo sem reflorestar, as mudas podem crescer por chuva ou por sementes no solo."},
  {t:"<b>Premissa 1:</b> Se reflorestarmos, então as mudas crescem.<br><b>Premissa 2:</b> As mudas NÃO cresceram.<br><b>Conclusão:</b> Logo, não reflorestamos.", r:"valido", e:"<b>VÁLIDO.</b> É o formato: Se p, então q. Não-q. Logo, não-p."},
  {t:"<b>Premissa 1:</b> Se desmatarmos, então os animais perdem o habitat.<br><b>Premissa 2:</b> Os animais perderam o habitat.<br><b>Conclusão:</b> Logo, desmatamos.", r:"invalido", e:"<b>INVÁLIDO.</b> Os animais podem ter perdido o habitat por incêndio, seca ou estrada."},
  {t:"<b>Premissa 1:</b> Se fragmentarmos a floresta, então o interior diminui.<br><b>Premissa 2:</b> O interior NÃO diminuiu.<br><b>Conclusão:</b> Logo, não fragmentamos.", r:"valido", e:"<b>VÁLIDO.</b> Mesmo formato: Se p, então q. Não-q. Logo, não-p."},
  {t:"<b>Premissa 1:</b> Se o efeito de borda aumentar, então as espécies de interior sofrem.<br><b>Premissa 2:</b> O efeito de borda NÃO aumentou.<br><b>Conclusão:</b> Logo, as espécies de interior não sofrem.", r:"invalido", e:"<b>INVÁLIDO.</b> As espécies de interior podem sofrer por falta de alimento, caça, doença ou seca."},
];
function nivel2(){ n2=0; mostrar2(); }
function mostrar2(){
  if(n2>=perguntas2.length){ tela.innerHTML=`<h2>🎉 Nível 2 completo!</h2><p>${pontos} pontos.</p><button class="next" onclick="menu()">Menu</button>`; return; }
  const p=perguntas2[n2];
  tela.innerHTML=`<span class="badge">NÍVEL 2 • ${n2+1}/7 • ${pontos} pts</span><p class="pergunta">${p.t}</p>
  <button class="v" onclick="resp2('valido')">✅ VÁLIDO</button>
  <button class="f" onclick="resp2('invalido')">❌ INVÁLIDO</button>
  <p id="feedback"></p><div id="btn"></div><p class="perdeu">Erro = -5 pontos</p>`;
}
function resp2(resp){
  const p=perguntas2[n2]; const ok=p.r===resp; if(ok) ganharPontos(20); else perderPontos();
  document.getElementById('feedback').innerHTML=ok?`<span class="certo">✅ Acertou! +20</span>`:`<span class="errado">❌ Errou! -5. Era: ${p.r==="valido"?"VÁLIDO":"INVÁLIDO"}</span>`;
  document.getElementById('btn').innerHTML=`<div class="explica">${p.e}</div><button class="next" onclick="n2++;mostrar2()">Próxima →</button>`;
}

// ================= NÍVEL 3 =================
function intro3(){
  tela.innerHTML=`
    <span class="badge">NÍVEL 3</span>
    <h2>📊 Antes de começar...</h2>
    <div class="conceito">
      <b>Você vai usar a tabela-verdade!</b><br><br>
      - <b>p → q</b> significa: <b>Se p, então q</b>. Só é <b>F</b> quando é <b>V → F</b>.<br>
      - <b>p ∧ q</b> significa: <b>p E q</b>. Só é <b>V</b> quando as duas são V.<br>
      - <b>¬p</b> significa: <b>NÃO p</b>. Inverte: ¬V = F, ¬F = V.
    </div>
    <p>✅ Acerto: <b>+15</b> &nbsp; | &nbsp; ❌ Erro: <b>-5</b></p>
    <button class="next" onclick="nivel3()">Entendi, começar! ▶️</button>
    <button onclick="menu()">Voltar</button>
  `;
}
let n3=0;
const perguntas3=[
  {t:`<b>🌱 Reflorestamento</b><br>p: Reflorestar a área<br>q: As mudas crescerem<br>Se p = <b>V</b> e q = <b>F</b>, quanto vale <b>p → q</b> ?`, r:"F", e:"<b>F.</b> V → F = F."},
  {t:`<b>🌲 Efeito de borda</b><br>p: Aumentar o efeito de borda<br>q: As espécies de interior sofrerem<br>Se p = <b>F</b> e q = <b>V</b>, quanto vale <b>p → q</b> ?`, r:"V", e:"<b>V.</b> F → V = V."},
  {t:`<b>🪓 Desmatamento</b><br>p: Desmatar a floresta<br>q: Os animais perderem o habitat<br>Se p = <b>V</b> e q = <b>V</b>, quanto vale <b>p → q</b> ?`, r:"V", e:"<b>V.</b> V → V = V."},
  {t:`<b>🧩 Fragmentação</b><br>p: Fragmentar a floresta<br>q: O interior diminuir<br>Se p = <b>F</b> e q = <b>F</b>, quanto vale <b>p → q</b> ?`, r:"V", e:"<b>V.</b> F → F = V."},
  {t:`<b>🌱 Reflorestamento + Efeito de borda</b><br>p: Plantar espécies pioneiras<br>q: O solo ficar protegido<br>Se p = <b>V</b> e q = <b>V</b>, quanto vale <b>p ∧ q</b> ?`, r:"V", e:"<b>V.</b> V ∧ V = V."},
  {t:`<b>🪓 Desmatamento + Fragmentação</b><br>p: Desmatar<br>q: Fragmentar<br>Se p = <b>V</b> e q = <b>F</b>, quanto vale <b>p ∧ q</b> ?`, r:"F", e:"<b>F.</b> V ∧ F = F."},
  {t:`<b>🌲 Efeito de borda</b><br>p: O efeito de borda aumentar<br>Se p = <b>F</b>, quanto vale <b>¬p</b> ?`, r:"V", e:"<b>V.</b> ¬F = V."},
  {t:`<b>🧩 Fragmentação</b><br>p: A fragmentação prejudicar os ecossistemas<br>Se p = <b>V</b>, quanto vale <b>¬p</b> ?`, r:"F", e:"<b>F.</b> ¬V = F."},
];
function nivel3(){ n3=0; mostrar3(); }
function mostrar3(){
  if(n3>=perguntas3.length){ tela.innerHTML=`<h2>🎉 Nível 3 completo!</h2><p>${pontos} pontos.</p><button class="next" onclick="menu()">Menu</button>`; return; }
  const p=perguntas3[n3];
  tela.innerHTML=`<span class="badge">NÍVEL 3 • TABELA-VERDADE • ${n3+1}/8 • ${pontos} pts</span><p class="pergunta">${p.t}</p>
  <table><tr><th>p</th><th>q</th><th>p → q</th><th>p ∧ q</th></tr><tr><td>V</td><td>V</td><td>V</td><td>V</td></tr><tr><td>V</td><td>F</td><td>F</td><td>F</td></tr><tr><td>F</td><td>V</td><td>V</td><td>F</td></tr><tr><td>F</td><td>F</td><td>V</td><td>F</td></tr></table>
  <button class="v" onclick="resp3('V')">V</button><button class="f" onclick="resp3('F')">F</button><p id="feedback"></p><div id="btn"></div><p class="perdeu">Erro = -5 pontos</p>`;
}
function resp3(resp){
  const p=perguntas3[n3]; const ok=p.r===resp; if(ok) ganharPontos(15); else perderPontos();
  document.getElementById('feedback').innerHTML=ok?`<span class="certo">✅ Acertou! +15</span>`:`<span class="errado">❌ Errou! -5. Era: ${p.r}</span>`;
  document.getElementById('btn').innerHTML=`<div class="explica">${p.e}</div><button class="next" onclick="n3++;mostrar3()">Próxima →</button>`;

// ================= NÍVEL 4 =================
function intro4(){
  tela.innerHTML=`
    <span class="badge">NÍVEL 4</span>
    <h2>🌲 Antes de começar...</h2>
    <div class="conceito">
      <b>Fragmentação:</b> dividir a floresta em pedaços menores.<br><br>
      <b>Efeito de borda:</b> a parte perto da borda sofre mais sol, vento, seca. O <b>interior</b> é mais úmido e protegido.<br><br>
      <b>Regra de ouro:</b> Quanto mais fragmentada, <b>maior a borda e menor o interior</b>.<br><br>
      - Região A (1 fragmento grande): interior = <b>4.800 m²</b>, borda = 36%<br>
      - Região B (5 fragmentos pequenos): interior = <b>2.306 m²</b>, borda = 69%<br><br>
      <b>Fórmula:</b> Área interior = 3 × (raio interior)², com π ≈ 3 e borda de 10m.
    </div>
    <p>✅ Acerto: <b>+25</b> &nbsp; | &nbsp; ❌ Erro: <b>-5</b></p>
    <button class="next" onclick="nivel4()">Entendi, começar! ▶️</button>
    <button onclick="menu()">Voltar</button>
  `;

let n4=0;
const perguntas4=[
  {t:"Região A tem 1 fragmento grande. Região B tem 5 fragmentos pequenos, mesma área total. Qual tem <b>mais interior de floresta</b>?", r:"Região A", e:"A: 4.800 m² de interior. B: só 2.306 m²."},
  {t:"Quanto mais fragmentada, maior a região de borda. Verdadeiro ou Falso?", r:true, e:"Verdadeiro! Borda na A = 36%, na B = 69%."},
  {t:"O efeito de borda existe só em floresta fragmentada. Verdadeiro ou Falso?", r:false, e:"Falso! Toda floresta tem borda."},
  {t:"Qual espécie sofre mais com fragmentação: espécie de borda ou espécie de interior?", r:"Interior", e:"Espécie de interior precisa de sombra e umidade."},
  {t:"<b>Calcule:</b> Raio interior = 40m, π ≈ 3. Área interior = 3 × 40² = ?", r:"4800", e:"3 × 1600 = 4.800 m². É o interior da Região A!"},
];
function nivel4(){ n4=0; mostrar4(); }
function mostrar4(){
  if(n4>=perguntas4.length){
    tela.innerHTML=`<h2>🎉 Nível 4 completo!</h2><p><b>${jogador}</b>, você tem <b>${pontos} pontos</b></p><button class="next" onclick="menu()">Menu</button><button class="next" style="background:#6a1b9a" onclick="intro5()">Ir para o Nível 5 →</button>`;
    return;
  }
  const p=perguntas4[n4];
  let botoes="";
  if(typeof p.r==="boolean") botoes=`<button class="v" onclick="resp4(true)">Verdadeiro</button><button class="f" onclick="resp4(false)">Falso</button>`;
  else if(p.r==="4800") botoes=`<input type="number" id="respInput" placeholder="???"> <button class="next" onclick="resp4(document.getElementById('respInput').value)">Responder</button>`;
  else if(p.r==="Região A") botoes=`<button class="opt" onclick="resp4('Região A')">Região A</button><button class="opt" onclick="resp4('Região B')">Região B</button>`;
  else botoes=`<button class="opt" onclick="resp4('Interior')">Espécie de interior</button><button class="opt" onclick="resp4('Borda')">Espécie de borda</button>`;
  tela.innerHTML=`<span class="badge">NÍVEL 4 • FRAGMENTAÇÃO • ${n4+1}/5 • ${pontos} pts</span><p class="pergunta">${p.t}</p>${botoes}<p id="feedback"></p><div id="btn"></div><p class="perdeu">Erro = -5 pontos</p>`;
}
function resp4(resp){
  const p=perguntas4[n4]; const ok=String(p.r)===String(resp); if(ok) ganharPontos(25); else perderPontos();
  document.getElementById('feedback').innerHTML=ok?`<span class="certo">✅ Acertou! +25</span>`:`<span class="errado">❌ Errou! -5. Era: ${p.r}</span>`;
  document.getElementById('btn').innerHTML=`<div class="explica">${p.e}</div><button class="next" onclick="n4++;mostrar4()">Próxima →</button>`;
}

// ================= NÍVEL 5 =================
function intro5(){
  tela.innerHTML=`
    <span class="badge" style="background:#6a1b9a">NÍVEL 5</span>
    <h2>✏️ Antes de começar...</h2>
    <div class="conceito">
      <b>O que você vai fazer?</b> Preencher a tabela-verdade inteira! Para acertar, tem que acertar <b>todas as 4 linhas</b>.<br><br>
      <b>Como montar:</b> 1️⃣ p e q com V-V, V-F, F-V, F-F. 2️⃣ Aplique a regra do símbolo. 3️⃣ Nas difíceis, resolva <b>primeiro o parênteses</b>.<br><br>
      <b>Símbolos:</b> ¬ NÃO (inverte) | ∧ E (só V se as duas V) | ∨ OU (só F se as duas F) | → Se... então (só F em V→F) | ↔ Se, e somente se (V se iguais)
    </div>
    <p>✅ Acerto na tabela toda: <b>+30</b> &nbsp; | &nbsp; ❌ Erro: <b>-5</b><br><span class="small">Questões 1 a 5: básicas | 6 a 10: 🔥 difíceis</span></p>
    <button class="next" onclick="nivel5()">Entendi, começar! ▶️</button>
    <button onclick="menu()">Voltar</button>
  `;
}
let n5=0;
const perguntas5=[
  {titulo:"🌱 <b>Q1 - E (∧)</b><br>p: Reflorestar<br>q: As mudas crescerem<br><b>p ∧ q</b>", coluna:"p ∧ q", gabarito:["V","F","F","F"], e:"p ∧ q só é V quando as duas são V."},
  {titulo:"🌲 <b>Q2 - OU (∨)</b><br>p: Desmatar<br>q: Fragmentar<br><b>p ∨ q</b>", coluna:"p ∨ q", gabarito:["V","V","V","F"], e:"p ∨ q só é F quando as duas são F."},
  {titulo:"🪓 <b>Q3 - Se... então (→)</b><br>p: Aumentar o efeito de borda<br>q: As espécies de interior sofrerem<br><b>p → q</b>", coluna:"p → q", gabarito:["V","F","V","V"], e:"p → q só é F em V → F."},
  {titulo:"🧩 <b>Q4 - Se, e somente se (↔)</b><br>p: Floresta fragmentada<br>q: Interior diminuir<br><b>p ↔ q</b>", coluna:"p ↔ q", gabarito:["V","F","F","V"], e:"p ↔ q é V quando são IGUAIS."},
  {titulo:"🌱 <b>Q5 - NÃO + E</b><br>p: Reflorestar<br>q: Proteger o solo<br><b>¬p ∧ q</b>", coluna:"¬p ∧ q", gabarito:["F","F","V","F"], e:"Primeiro ¬p, depois E. V-V: F∧V=F | V-F: F∧F=F | F-V: V∧V=V | F-F: V∧F=F"},
  {titulo:"🔥 <b>Q6 - DIFÍCIL: Conjunção + Implicação</b><br>p: Reflorestar<br>q: As mudas crescerem<br><b>(p ∧ q) → p</b>", coluna:"(p ∧ q) → p", gabarito:["V","V","V","V"], e:"1º p∧q, depois → p. V-V: V→V=V | V-F: F→V=V | F-V: F→F=V | F-F: F→F=V. Tautologia!"},
  {titulo:"🔥 <b>Q7 - DIFÍCIL: Disjunção + Implicação</b><br>p: Desmatar<br>q: Fragmentar<br><b>(p ∨ q) → q</b>", coluna:"(p ∨ q) → q", gabarito:["V","F","V","V"], e:"1º p∨q, depois → q. V-V: V→V=V | V-F: V→F=F | F-V: V→V=V | F-F: F→F=V"},
  {titulo:"🔥 <b>Q8 - DIFÍCIL: Implicação + Conjunção</b><br>p: Aumentar o efeito de borda<br>q: Espécies de interior sofrerem<br><b>(p → q) ∧ p</b>", coluna:"(p → q) ∧ p", gabarito:["V","F","F","F"], e:"1º p→q, depois ∧ p. V-V: V∧V=V | V-F: F∧V=F | F-V: V∧F=F | F-F: V∧F=F"},
  {titulo:"🔥 <b>Q9 - DIFÍCIL: Implicação OU Conjunção</b><br>p: Reflorestar<br>q: Proteger o solo<br><b>(p → q) ∨ (p ∧ q)</b>", coluna:"(p → q) ∨ (p ∧ q)", gabarito:["V","F","V","V"], e:"Faça os 2 parênteses, depois OU. V-V: V∨V=V | V-F: F∨F=F | F-V: V∨F=V | F-F: V∨F=V"},
  {titulo:"🔥 <b>Q10 - DESAFIO FINAL: Conjunção + Disjunção + Implicação</b><br>p: Fragmentar<br>q: Interior diminuir<br><b>(p → q) ∧ (p ∨ q)</b>", coluna:"(p → q) ∧ (p ∨ q)", gabarito:["V","F","V","F"], e:"Faça os 2 parênteses, depois E. V-V: V∧V=V | V-F: F∧V=F | F-V: V∧V=V | F-F: V∧F=F"},
];
function nivel5(){ n5=0; mostrar5(); }
function mostrar5(){
  if(n5>=perguntas5.length){
    salvarRanking();
    tela.innerHTML=`<h2>🏆 Você salvou a floresta!</h2><p><b>${jogador}</b>, placar final: <b>${pontos} pontos</b></p>${modoOnline?`<h3>🏆 Ranking da Sala ${codigoSala} - AO VIVO</h3><div class="ranking" id="rankingOnlineAoVivo"></div>`:`<h3>🏆 Ranking</h3><div class="ranking">${mostrarRankingHTML()}</div>`}<br><button class="next" onclick="pontos=0;menu()">Jogar de novo</button><button onclick="verRanking()">Ver Ranking</button>`;
    return;
  }
  const p=perguntas5[n5];
  const linhas=[{p:"V", q:"V"},{p:"V", q:"F"},{p:"F", q:"V"},{p:"F", q:"F"}];
  let rows = linhas.map((l,i)=>`<tr><td>${l.p}</td><td>${l.q}</td><td><select id="sel${i}"><option value="">?</option><option value="V">V</option><option value="F">F</option></select></td></tr>`).join('');
  tela.innerHTML=`
    <span class="badge" style="background:#6a1b9a">NÍVEL 5 • MONTE A TABELA • ${n5+1}/10 • ${pontos} pts</span>
    <p class="pergunta">${p.titulo}</p>
    <p class="small">Preencha toda a última coluna. Tem que acertar as 4 linhas!</p>
    <table class="tabela5"><tr><th>p</th><th>q</th><th>${p.coluna}</th></tr>${rows}</table>
    <button class="next" onclick="resp5()">Conferir minha tabela ✅</button>
    <p id="feedback"></p><div id="btn"></div><p class="perdeu">Erro = -5 pontos</p>`;
}
function resp5(){
  const p=perguntas5[n5];
  let respostas=[];
  for(let i=0;i<4;i++){
    let v=document.getElementById('sel'+i).value;
    if(!v){ alert("Preencha as 4 linhas antes de conferir!"); return; }
    respostas.push(v);
  }
  const ok = respostas.join(',')===p.gabarito.join(',');
  if(ok) ganharPontos(30); else perderPontos();
  let gabaritoHTML = `<table><tr><th>p</th><th>q</th><th>${p.coluna}</th><th>Sua resposta</th></tr>` +
    [["V","V"],["V","F"],["F","V"],["F","F"]].map((l,i)=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td><b>${p.gabarito[i]}</b></td><td>${respostas[i]} ${respostas[i]===p.gabarito[i]?'✅':'❌'}</td></tr>`).join('') + `</table>`;
  document.getElementById('feedback').innerHTML=ok?`<span class="certo">✅ Tabela perfeita! +30</span>`:`<span class="errado">❌ Errou! -5. Veja a tabela certa:</span>`;
  document.getElementById('btn').innerHTML=`<div class="explica">${p.e}</div>${gabaritoHTML}<button class="next" onclick="n5++;mostrar5()">Próxima →</button>`;
}

if(jogador) menu(); else telaNome();
</script>
